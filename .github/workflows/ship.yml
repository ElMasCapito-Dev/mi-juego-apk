name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Usamos la imagen oficial de Kivy/Buildozer para que no falle Docker
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1.2.0
        with:
          workdir: .
          buildozer_version: stable
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Juego-APK
          path: bin/*.apk
